services:
  chat_service:
    build:
      context: ./ChatService
      dockerfile: Dockerfile
    container_name: chat_service
    env_file:
      - ./ChatService/.env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app

  facility_service:
    build:
      context: ./FacilityService
      dockerfile: Dockerfile
    container_name: facility_service
    env_file:
      - ./FacilityService/.env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app

  subscription_service:
    build:
      context: ./SubscriptionsService
      dockerfile: Dockerfile
    container_name: subscription_service
    env_file:
      - ./SubscriptionsService/.env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app

  user_service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    container_name: user_service
    env_file:
      - ./UserService/.env
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app

  gateway_service:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: gateway_service
    env_file:
      - ./Gateway/.env
    ports:
      - "5054:80"
    environment:
      - USERS_HOST=user_service
      - USERS_PORT=80
      - CHAT_HOST=chat_service
      - CHAT_PORT=80
      - FACILITY_HOST=facility_service
      - FACILITY_PORT=80
      - SUBSCRIPTION_HOST=subscription_service
      - SUBSCRIPTION_PORT=80
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      chat_service:
        condition: service_started
      facility_service:
        condition: service_started
      subscription_service:
        condition: service_started
      user_service:
        condition: service_started
    networks:
      - app

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=RentFlowDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d RentFlowDb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pg_data:
  redis_data:

networks:
  app:
    driver: bridge
